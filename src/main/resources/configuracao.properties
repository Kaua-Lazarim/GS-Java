# Configuracao do Territory Predictive Insights
# Lida uma unica vez pela classe ConfiguracaoSistema (Singleton).

# Banco H2 gravado em arquivo (pasta ./dados), para o historico sobreviver ao reinicio.
# DB_CLOSE_DELAY=-1 mantem o banco aberto enquanto o programa roda (evita reabrir o arquivo a cada operacao).
banco.url=jdbc:h2:file:./dados/territorio;DB_CLOSE_DELAY=-1
banco.usuario=sa
banco.senha=

# Estrategias de previsao ativas, na ordem em que rodam (chaves da FabricaPrevisao)
previsao.estrategias=MEDIA_MOVEL,COMPARACAO
# Abaixo deste numero de leituras o sistema nao faz previsao
previsao.minimoLeituras=5
# Quantas leituras entram na media movel
previsao.janelaMediaMovel=5
# Tamanho de cada periodo na comparacao (atual x anterior)
previsao.periodoComparacao=3
# Quantas leituras mais recentes sao buscadas no banco para prever
previsao.leiturasConsultadas=20

# Limiares iniciais por tipo de sensor: atencao,alerta,critico
# Pluviometro em mm/h, nivel do corrego em cm, umidade do solo em %
limiar.PLUVIOMETRO=20,35,50
limiar.NIVEL_CORREGO=150,220,300
limiar.UMIDADE_SOLO=70,80,90

# Codigo pedido no menu para alterar limiares
territorio.codigoAcesso=VILA2026
